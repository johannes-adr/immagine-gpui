[package]
name = "gpui-web-demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { version = "0.8.1", default-features = false, features = ["component"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures-lite = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
image = { version = "0.25", default-features = false }
web-sys = { version = "0.3", features = [
    "Window", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "Event", "EventTarget",
    "Location", "Storage", "console", "Performance", "ImageBitmap", "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d", "ImageData", "Blob", "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode",
    "IdbOpenDbRequest", "IdbRequest",
] }

# GPUI patched with a liquid-glass renderer pass (see vendor/).
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-web = { path = "vendor/gpui-pre-web" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
