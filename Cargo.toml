[package]
name = "gpui-web-demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { version = "0.8.1", default-features = false, features = ["component"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false }
mp4 = "0.14"

[dev-dependencies]
futures-lite = "2"
gpui = { package = "gpui-pre", version = "0.3.10", features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "Event", "EventTarget",
    "Location", "Storage", "console", "Performance", "ImageBitmap", "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d", "ImageData", "Blob", "PointerEvent", "MouseEvent", "Document", "HtmlElement",
    "CssStyleDeclaration", "Node", "Element", "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode",
    "IdbOpenDbRequest", "IdbRequest", "Url", "AbortController", "AbortSignal",
    "Navigator", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioBuffer", "AudioBufferSourceNode", "BaseAudioContext",
] }

# Desktop host (src/host/desktop): blocking HTTP on worker threads, image codecs, a oneshot to hand results back.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "2", features = ["cookies"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
futures-channel = "0.3"

# gpui-kit leaves its platform re-export out on iOS, so the native iOS backend (UIKit + the patched Metal renderer) comes in directly.
[target.'cfg(target_os = "ios")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "0.3.10" }
# Share sheet (src/host/desktop/share.rs); same versions and objc2 as gpui-pre-ios, so no second copy is built.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSError", "NSGeometry", "NSObject", "NSSet", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "UIActivity", "UIActivityViewController", "UIApplication", "UIPopoverSupport", "UIGeometry", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIScene", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSArray", "NSURL", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSSharingService", "NSView", "NSWindow"] }

[[bin]]
name = "immagine-desktop"
path = "src/bin/immagine-desktop.rs"

# GPUI patched with a liquid-glass renderer pass (see vendor/).
[patch.crates-io]
# display link frame-rate range for 120 Hz (see AGENTS.md "Native iOS")
gpui-pre-ios = { path = "vendor/gpui-pre-ios" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-web = { path = "vendor/gpui-pre-web" }
# gpui-kit input field: reports its text length so the iOS keyboard can open (see AGENTS.md "Native iOS")
gpui-base = { path = "vendor/gpui-base" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
