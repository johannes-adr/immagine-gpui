<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#cfe3ff">
  <meta name="apple-mobile-web-app-title" content="Reminders">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="modulepreload" href="pkg/gpui_web_demo.js">
  <title>Reminders</title>
  <style>
    /* Pin the page to the visible area so iOS Safari cannot scroll the document or leave a gap
       when its toolbar collapses; the canvas fills this box. */
    html, body { margin: 0; position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: #cfe3ff; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    /* Installed PWA: there is no browser chrome, and dvh/% can stop short of the home-indicator area
       on iOS. 100vh is the full screen there, so use it and let the canvas run edge to edge. */
    @media (display-mode: standalone) { html, body { height: 100vh; min-height: 100vh; } }
    @media (prefers-color-scheme: dark) { html, body { background: #0b1026; } }
    /* Launch screen: shown instantly, removed once GPUI has painted its first frame. */
    #splash { position: fixed; inset: 0; box-sizing: border-box; padding: calc(env(safe-area-inset-top) + 64px) 20px 0;
      font: 700 34px/1.2 -apple-system, system-ui, sans-serif; color: #1c2a44;
      background: linear-gradient(160deg, #cfe3ff, #e9dcff); transition: opacity .2s; }
    #splash i { display: block; height: 52px; margin-top: 12px; border-radius: 14px; background: rgba(255,255,255,.55); }
    #splash i:first-of-type { margin-top: 24px; }
    @media (prefers-color-scheme: dark) { #splash { color: #fff; background: linear-gradient(160deg, #0b1026, #1d1740); }
      #splash i { background: rgba(255,255,255,.08); } }
    #probe { position: fixed; visibility: hidden; pointer-events: none;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="splash">Reminders<i></i><i></i><i></i></div>
  <div id="probe"></div>
  <script type="module">
    // Start the wasm download right away, in parallel with the JS glue module.
    const t0 = performance.now();
    // Installed iOS PWA: dvh/vh/% can stop short of the home-indicator area (WebKit bugs 237961,
    // 254868, 292603), so size the page from the physical screen instead.
    if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) {
      const fit = () => {
        const portrait = innerHeight >= innerWidth;
        const long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        const h = portrait ? long : short;
        for (const el of [document.documentElement, document.body]) el.style.height = Math.max(h, innerHeight) + "px";
      };
      fit();
      addEventListener("resize", fit);
      addEventListener("orientationchange", () => setTimeout(fit, 100));
    }
    const wasm = fetch(new URL("./pkg/gpui_web_demo_bg.wasm", import.meta.url));
    const log = (m) => console.log(`[boot] ${m} +${Math.round(performance.now() - t0)}ms (since nav ${Math.round(performance.now())}ms)`);
    try {
      const { default: init, run } = await import("./pkg/gpui_web_demo.js");
      const cs = getComputedStyle(document.getElementById("probe"));
      log("js loaded");
      await init({ module_or_path: wasm });
      log("wasm ready");
      run(parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingBottom) || 0,
          matchMedia("(prefers-color-scheme: dark)").matches, !!navigator.gpu);
      log("run returned");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        log("first frame");
        const sp = document.getElementById("splash");
        sp.style.opacity = 0;
        setTimeout(() => sp.remove(), 250);
      }));
    } catch (e) {
      document.body.textContent = "Failed to load the application: " + e;
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
