<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="Immagine">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="modulepreload" href="pkg/gpui_web_demo.js">
  <title>Immagine</title>
  <style>
    /* Pin the page to the visible area so iOS Safari cannot scroll the document or leave a gap
       when its toolbar collapses; the canvas fills this box. */
    html, body { margin: 0; position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: #fff; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    /* Installed iOS PWA (WebKit 301108): the viewport comes up one status-bar height short and nothing
       position:fixed paints below it, so drop the fixed pinning and size body to the large viewport. */
    @media (display-mode: standalone) {
      html { position: static; inset: auto; height: auto; min-height: 100lvh; }
      body { position: relative; inset: auto; width: 100%; height: 100lvh; min-height: 100lvh; }
    }
    @media (prefers-color-scheme: dark) { html, body { background: #000; } }
    /* Launch screen: shown instantly, removed once GPUI has painted its first frame. */
    #splash { position: fixed; inset: 0; box-sizing: border-box; padding: calc(env(safe-area-inset-top) + 64px) 20px 0;
      font: 700 34px/1.2 -apple-system, system-ui, sans-serif; color: #000;
      background: #fff; transition: opacity .2s; }
    #splash i { display: block; height: 52px; margin-top: 12px; border-radius: 14px; background: rgba(0,0,0,.06); }
    #splash i:first-of-type { margin-top: 24px; }
    @media (prefers-color-scheme: dark) { #splash { color: #fff; background: #000; }
      #splash i { background: rgba(255,255,255,.08); } }
    #probe { position: fixed; visibility: hidden; pointer-events: none;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="splash">Immagine</div>
  <div id="probe"></div>
  <script type="module">
    // Start the wasm download right away, in parallel with the JS glue module.
    const t0 = performance.now();
    const wasm = fetch(new URL("./pkg/gpui_web_demo_bg.wasm", import.meta.url));
    const log = (m) => console.log(`[boot] ${m} +${Math.round(performance.now() - t0)}ms (since nav ${Math.round(performance.now())}ms)`);
    try {
      const { default: init, run } = await import("./pkg/gpui_web_demo.js");
      const cs = getComputedStyle(document.getElementById("probe"));
      log("js loaded");
      await init({ module_or_path: wasm });
      log("wasm ready");
      run(parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingBottom) || 0,
          matchMedia("(prefers-color-scheme: dark)").matches, !!navigator.gpu);
      log("run returned");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        log("first frame");
        const sp = document.getElementById("splash");
        sp.style.opacity = 0;
        setTimeout(() => sp.remove(), 250);
      }));
    } catch (e) {
      document.body.textContent = "Failed to load the application: " + e;
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
